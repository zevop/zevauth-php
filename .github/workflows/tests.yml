name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    name: PHP ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: openssl, json
          coverage: none
      - run: composer update --no-interaction --no-progress --prefer-dist
      - run: vendor/bin/phpunit
      - run: vendor/bin/phpstan analyse --no-progress

  core-on-php81:
    # The core library supports PHP 8.1; the Laravel test suite needs 8.2+.
    runs-on: ubuntu-latest
    name: PHP 8.1 (core)
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - run: composer remove --dev orchestra/testbench --no-interaction --no-update
      - run: composer update --no-interaction --no-progress --prefer-dist --with-all-dependencies
      - run: vendor/bin/phpunit --testsuite conformance
